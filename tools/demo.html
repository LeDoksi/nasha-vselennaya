<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💜 Наша вселенная</title>
  <meta name="theme-color" content="#090c1c">
  <!-- tools/demo.html — визуальный стенд. В прод не попадает: deploy-pages.yml
       копирует явный список файлов, tools/ в него не входит. CSP настоящего
       index.html здесь намеренно не скопирован: она держит script-src на
       gstatic.com/apis.google.com ради Firebase и не пускает inline-скрипт
       заглушки ниже — стенду он и нужен вместо Firebase, поэтому запрет
       inline-скриптов пришлось бы снимать всё равно. Сеть Firestore/Yandex
       стенду не нужна вообще (см. заглушку внизу файла), так что зауженный
       connect-src настоящего сайта тут просто не имеет смысла. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
  <script src="tools/demo-fixtures.js"></script>
  <script>
    // Заглушка входа и базы: приложение думает, что Гоша вошёл через Google, а
    // Firestore/Yandex Object Storage подменены хранилищем в памяти на
    // demoFixtures. Ни одного сетевого запроса — стенд работает офлайн.
    //
    // Как приложение решает, что пользователь вошёл (см. src/01-gate.js):
    // tryEnterWithUser() проверяет user.email по ALLOWED_EMAILS, дальше
    // unlockWithKey() → unlockApp() снимает класс `auth` с <body> — это
    // единственный переключатель видимости приложения (src/01-gate.js:236).
    // Экраны читают данные из единственной точки — глобального объекта `db`
    // (src/00-core.js:264), который наполняет репозиторий (src/04-repo.js,
    // loadHotSet()) через fsCol()/fsDoc() (src/03-firestore.js) — здесь их
    // подменяет фейковый firebase.firestore() ниже.
    'use strict';
    window.__DEMO__ = true;

    // ===== Сеть отключена целиком =====
    // photo-sync (src/95-photos-cloud.js) и push (src/96-push.js) в реальном
    // приложении сами дёргают fetch/serviceWorker — их не отключить точечно,
    // не трогая src/. Перехватываем на уровне браузерных API: код приложения
    // остаётся нетронутым, а наружу не уходит ни одного запроса.
    (function () {
      var BLOCKED = /firestore\.googleapis\.com|functions\.yandexcloud\.net|storage\.yandexcloud\.net|googleapis\.com/;
      var realFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
      window.fetch = function (input, init) {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (BLOCKED.test(url)) return Promise.reject(new Error('demo: сеть отключена в визуальном стенде'));
        return realFetch ? realFetch(input, init) : Promise.reject(new Error('demo: fetch недоступен'));
      };
      // registerServiceWorker() (src/96-push.js) регистрирует 'sw.js' относительно
      // текущей страницы — на стенде (tools/demo.html) это несуществующий
      // tools/sw.js. Подмена вместо гашения 404 в консоли на каждый заход.
      if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
        navigator.serviceWorker.register = function () {
          return Promise.reject(new Error('demo: service worker отключён в стенде'));
        };
      }
    })();

    // ===== Фейковый Firestore: те же коллекции, что и в настоящей базе,
    // наполненные demoFixtures, целиком в памяти вкладки. =====
    (function () {
      var FIELD_DELETE = '__DEMO_FIELD_DELETE__'; // сентинел для firebase.firestore.FieldValue.delete()
      var COLLS = ['events', 'dates', 'notes', 'lists', 'wishes', 'photos', 'labels'];
      var data = {};
      COLLS.forEach(function (name) {
        var map = new Map();
        (demoFixtures[name] || []).forEach(function (item) {
          map.set(item.id, item);
        });
        data[name] = map;
      });
      data.meta = new Map([['settings', { pushSubs: {} }]]);

      function applyPatch(target, patch) {
        Object.keys(patch).forEach(function (path) {
          var parts = path.split('.');
          var obj = target;
          for (var i = 0; i < parts.length - 1; i++) obj = obj[parts[i]] = obj[parts[i]] || {};
          var last = parts[parts.length - 1];
          if (patch[path] === FIELD_DELETE) delete obj[last];
          else obj[last] = patch[path];
        });
      }

      function makeDocRef(collName, id) {
        return {
          get: function () {
            var raw = data[collName].get(id);
            return Promise.resolve({ id: id, exists: !!raw, data: function () { return raw ? Object.assign({}, raw) : undefined; } });
          },
          set: function (obj) {
            data[collName].set(id, Object.assign({}, obj));
            return Promise.resolve();
          },
          update: function (patch) {
            var cur = Object.assign({}, data[collName].get(id) || {});
            applyPatch(cur, patch);
            data[collName].set(id, cur);
            return Promise.resolve();
          },
          delete: function () {
            data[collName].delete(id);
            return Promise.resolve();
          },
          onSnapshot: function (cb) {
            // meta/settings — единственный документ (не коллекция), на который
            // startLiveUpdates() (src/04-repo.js) подписывается напрямую.
            this.get().then(cb);
            return function unsub() {};
          },
          collection: function (subName) {
            return makeQuery(subName);
          }
        };
      }

      function makeQuery(collName, f) {
        f = f || { wheres: [] };
        return {
          where: function (field, op, val) {
            return makeQuery(collName, Object.assign({}, f, { wheres: f.wheres.concat([[field, op, val]]) }));
          },
          orderBy: function (field, dir) {
            return makeQuery(collName, Object.assign({}, f, { order: [field, dir || 'asc'] }));
          },
          limit: function (n) {
            return makeQuery(collName, Object.assign({}, f, { limitN: n }));
          },
          startAfter: function (snap) {
            return makeQuery(collName, Object.assign({}, f, { after: snap && snap.id }));
          },
          doc: function (id) {
            return makeDocRef(collName, id);
          },
          get: function () {
            var rows = [];
            data[collName].forEach(function (d, id) {
              rows.push({ id: id, d: d });
            });
            f.wheres.forEach(function (w) {
              var field = w[0],
                op = w[1],
                val = w[2];
              rows = rows.filter(function (r) {
                var v = r.d[field];
                if (op === '==') return v === val;
                if (op === '>=') return v >= val;
                if (op === '<=') return v <= val;
                return true;
              });
            });
            if (f.order) {
              var field2 = f.order[0],
                dir = f.order[1];
              rows.sort(function (a, b) {
                var av = a.d[field2],
                  bv = b.d[field2];
                var cmp = av > bv ? 1 : av < bv ? -1 : 0;
                return dir === 'desc' ? -cmp : cmp;
              });
            }
            if (f.after) {
              var idx = rows.findIndex(function (r) {
                return r.id === f.after;
              });
              rows = idx === -1 ? [] : rows.slice(idx + 1);
            }
            if (f.limitN) rows = rows.slice(0, f.limitN);
            return Promise.resolve({
              docs: rows.map(function (r) {
                return { id: r.id, exists: true, data: function () { return Object.assign({}, r.d); } };
              })
            });
          },
          onSnapshot: function (cb) {
            // Живые апдейты (startLiveUpdates, src/04-repo.js) стенду не нужны —
            // фикстуры не меняются извне. Один вызов с текущим срезом достаточно,
            // чтобы db.notes/db.lists/... не остались пустыми.
            this.get().then(cb);
            return function unsub() {};
          }
        };
      }

      window.__demoFirestore = {
        enablePersistence: function () {
          return Promise.resolve();
        },
        collection: function () {
          // Единственный путь в приложении — couples/main/<коллекция> и
          // couples/main/meta/settings (см. fsDoc()/fsCol() в src/03-firestore.js).
          return {
            doc: function () {
              return { collection: function (subName) { return makeQuery(subName); } };
            }
          };
        },
        batch: function () {
          var ops = [];
          return {
            set: function (ref, obj) {
              ops.push(function () { return ref.set(obj); });
            },
            commit: function () {
              return ops.reduce(function (p, op) { return p.then(op); }, Promise.resolve());
            }
          };
        }
      };
      window.__demoFieldDelete = FIELD_DELETE;
    })();

    // ===== Фейковый Firebase: вход считается пройденным сразу заглушкой,
    // без единого реального запроса. =====
    (function () {
      var demoUser = { email: 'shakov.georgy@gmail.com', getIdToken: function () { return Promise.resolve('demo-token'); } };
      var demoAuth = {
        currentUser: demoUser,
        getRedirectResult: function () {
          return Promise.resolve({}); // без user — boot() падает на onAuthStateChanged ниже
        },
        onAuthStateChanged: function (handler) {
          setTimeout(function () {
            handler(demoUser);
          }, 0);
          return function unsub() {};
        },
        signOut: function () {
          return Promise.resolve();
        }
      };
      function firebase() {}
      firebase.initializeApp = function () {
        return { name: 'demo' };
      };
      firebase.auth = function () {
        return demoAuth;
      };
      firebase.auth.GoogleAuthProvider = function () {};
      firebase.firestore = function () {
        return window.__demoFirestore;
      };
      firebase.firestore.FieldValue = { delete: function () { return window.__demoFieldDelete; } };
      window.firebase = firebase;
    })();
  </script>
  <script src="tools/demo-boot.js"></script>
</body>
</html>
