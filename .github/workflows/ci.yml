name: CI — сборка и тесты

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать код
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Установить зависимости
        run: npm install
      - name: Сборка app.js + все тесты (npm run check)
        run: npm run check
      - name: app.js в коммите совпадает со сборкой из src/
        # Ловит ровно тот баг, что был найден вручную 12.08.2026: pre-commit
        # хук пересобирает app.js на диске, но если его забыли git add —
        # в коммит уходит устаревший файл, а тесты этого не видят (собранный
        # на CI app.js всегда свежий, сравнивать не с чем). Тут — с чем: git
        # diff после чистой пересборки должен быть пустым.
        run: |
          git diff --exit-code app.js || {
            echo "::error::app.js не совпадает с 'node build.js' из текущих src/*.js — забыли пересобрать перед коммитом?"
            exit 1
          }
