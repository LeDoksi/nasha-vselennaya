name: Публикация на GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Собрать app.js из src/
        run: node build.js
      - name: Собрать публикуемые файлы
        run: |
          mkdir -p _site/fonts _site/vendor
          cp index.html app.js styles.css icon.svg manifest.webmanifest _site/
          cp -r fonts/* _site/fonts/
          cp -r vendor/* _site/vendor/
      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
